aid: aone
name: AOne
description: >-
  AOne is a Malaysia-based learning-centre management software company (operating
  publicly as AOneSchools) whose all-in-one platform is used by 4,000+ tuition
  centres, preschools, enrichment centres, sports academies, and language centres
  to automate billing, LHDN e-invoicing, attendance tracking, student and class
  management, and parent communication across connected web and mobile apps. It
  was added to the API Evangelist network as a 500 Global portfolio company. The
  company's public surface today is a marketing website (aone.com.my) and a
  customer login/app at app.aoneschools.com; no public developer API, OpenAPI
  specification, or /.well-known discovery surface is currently published.
